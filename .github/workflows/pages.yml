name: Publish website

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed main branch to the club website
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ github.repository == 'nceofficialroboticsclub/website' &&
          github.ref == 'refs/heads/main' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      SITE_ORIGIN: https://nceofficialroboticsclub.github.io
      SITE_BASE: /website/
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: corepack pnpm format:check
      - name: Check types and public content
        run: corepack pnpm check
      - name: Test public rules
        run: corepack pnpm test:unit
      - name: Build static pages
        run: corepack pnpm build
      - name: Install test browser
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Test public browser journeys
        run: corepack pnpm test:browser
      - name: Check Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -z "$(find dist -type l -print -quit)"
      - name: Upload static pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --tls-min-v1.3
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
